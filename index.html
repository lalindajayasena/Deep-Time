{n:"Year 1 · Foundations",m:["Introduction to Paleontology","Geological Time and Earth History","Fundamentals of Geology","Fossilization and Taphonomy","Evolutionary Biology","Systematics and Phylogenetics","Comparative Vertebrate Anatomy","Introduction to Paleoecology"]},
{n:"Year 2 · Evolutionary History",m:["Origin of Life","Precambrian Life","Cambrian Explosion","Paleozoic Evolution","Evolution of Terrestrial Ecosystems","Mesozoic Life","Dinosaur Paleontology","Evolution of Birds","Mammalian Evolution","Cenozoic Evolution"]},
{n:"Year 3 · Advanced Paleontology",m:["Vertebrate Paleontology","Invertebrate Paleontology","Paleobotany","Micropaleontology","Paleoclimatology","Mass Extinctions","Functional Morphology","Biomechanics","Paleoanthropology","Biogeography"]},
{n:"Year 4 · Research Training",m:["Advanced Phylogenetics","Quantitative Paleontology","Fossil Preparation","Geochemical Paleontology","Digital Paleontology","3D Morphometrics","Scientific Research Methodology","Scientific Paper Analysis","Research Project","Dissertation"]}];

const LESSONS={fossil1:{
title:"What is a fossil?",
obj:["Define a fossil and explain why the definition is a convention.","Distinguish body fossils from trace fossils.","Describe the main ways remains are preserved.","Explain why the fossil record is biased, and why that does not make it useless."],
sec:[
["Introduction",["Paleontology is the scientific study of life in the geological past. It joins two older sciences: geology, which reads the history of rocks, and biology, which studies living things. The word fossil comes from the Latin fossilis, meaning “dug up”.","A fossil is any preserved evidence of an organism that lived in the geological past. Many textbooks use an age of roughly 10,000 years as a rough guide, close to the start of the Holocene. This is a human convention, not a natural boundary: there is no single moment when a bone becomes a fossil."]],
["Body fossils and trace fossils",["Body fossils are parts of the organism itself: bones, teeth, shells, wood, leaves, pollen. Trace fossils (ichnofossils) record what an organism did, not what it was: footprints, trackways, burrows, bite marks, and coprolites (fossil dung). Coprolites count as traces because they record biological activity, even though they contain material that came from the organism.","Trace fossils are valuable because they show behaviour, such as walking speed or feeding, that a skeleton alone cannot show. One animal can leave many traces in its life and can also leave several body remains, such as shed teeth, so counts of traces and bodies cannot be compared simply. Chemical traces, such as molecular remains of lipids, are sometimes called chemical fossils."]],
["How remains are preserved",["Fossilization is rare. Rapid burial greatly improves the chances of preservation, although it is not required for every pathway. Protection from scavengers and decay, and slow chemical change during burial, also help. The study of everything that happens between death and discovery is called taphonomy.","Common modes of preservation: (1) unaltered hard parts, such as some young shells and tooth enamel; (2) permineralization, where minerals from groundwater fill the tiny spaces in bone or wood; (3) replacement, where original material is dissolved and replaced by another mineral; (4) molds and casts, which are impressions and their fillings; (5) carbonization, a thin film of carbon left on leaves or soft-bodied animals; (6) entombment in amber (fossilized plant resin); (7) freezing or drying, which is rare and mostly geologically young."]],
["Why the fossil record is biased",["Organisms with hard parts fossilize far more easily than soft-bodied ones. Animals living where sediment is building up, such as shallow seas, lakes, and river floodplains, are over-represented. Animals living on eroding highlands are under-represented.","A few sites preserve soft tissues and fine detail. These are called Lagerstätten. Two well-known examples are the Cambrian Burgess Shale of British Columbia, Canada, and the Late Jurassic Solnhofen Limestone of Bavaria, Germany, famous for Archaeopteryx."]],
["Scientific reasoning",["Good paleontology separates observation from inference. The shape of a tooth is an observation. A claim about diet is an inference that needs support, such as wear patterns or comparison with living animals.","Gaps in the record are real, but their causes are understood and can be modelled. Scientists therefore state conclusions together with their uncertainty, instead of rejecting the record or treating it as complete."]]],
terms:[["Taphonomy","The study of processes affecting an organism after death, until it is found as a fossil."],["Diagenesis","Physical and chemical changes in sediment and buried remains after burial."],["Body fossil","Preserved part of the organism itself."],["Trace fossil (ichnofossil)","Preserved evidence of behaviour, such as a footprint or burrow."],["Coprolite","Fossilized dung."],["Permineralization","Mineral deposition in the pores of buried tissue."],["Lagerstätte","A site with exceptional fossil preservation."]],
mis:["“Fossils are always turned completely to stone.” Many fossil bones keep part of their original material, together with added minerals.","“Fossil means dinosaur.” Most fossils are of invertebrates, plants, and microbes.","“Most fossils are dated by radiocarbon.” Radiocarbon dating works only to roughly 50,000 years, and the practical limit depends on contamination and method. Older fossils are usually dated by measuring the rock layers around them, often volcanic layers, and by their position in the sequence.","“The fossil record is complete” and “the fossil record is useless” are both wrong. It is incomplete, with known biases."],
sum:["A fossil is preserved evidence of ancient life; the age cut-off is a convention.","Body fossils show anatomy; trace fossils show behaviour.","Preservation needs rapid burial and favourable chemistry, so it is rare and biased.","Scientists handle gaps by modelling the biases and reporting uncertainty."],
q:[
["Which of these is a trace fossil?",["A petrified tree trunk","A set of footprints preserved in mudstone","A shell replaced by calcite","An insect trapped in amber"],1,"Footprints record behaviour, not the body. The other three are parts of the organism itself, so they are body fossils."],
["Why are shelled marine animals so common in the fossil record?",["Soft-bodied animals did not exist before the Cambrian","Hard parts resist decay, and shallow seas bury remains quickly","Fossils can only form in water","Marine animals were always more numerous than land animals"],1,"Hard parts survive decay and shallow seas accumulate sediment. The other options are false or unsupported: soft-bodied life is known from older rocks, and land fossils do form."],
["Minerals from groundwater fill the pores of a buried bone. What is this process called?",["Carbonization","Permineralization","Freezing","Mold formation"],1,"Permineralization is the filling of pore spaces by minerals. Carbonization leaves a thin carbon film; a mold is an impression."],
["A student says: “The record is incomplete, so we can conclude nothing about the past.” Best evaluation?",["Correct, incomplete data is worthless","Incorrect, because the record is complete for marine life","Weak reasoning: biases are understood and conclusions are drawn with stated uncertainty","Correct, because fossils are unreliable"],2,"Every science works with incomplete data. The skill is to estimate how the gaps arose and how much they matter."]],
refs:[["OpenStax, Biology 2e (free university textbook)","https://openstax.org/details/books/biology-2e"],["Paleobiology Database (fossil occurrence data)","https://paleobiodb.org"],["International Commission on Stratigraphy (geological time scale)","https://stratigraphy.org"]]}};
let D={};try{D=JSON.parse(localStorage.getItem("dt1"))||{}}catch(e){}
D.done=D.done||{};D.ans=D.ans||{};D.notes=D.notes||[];
const save=()=>{try{localStorage.setItem("dt1",JSON.stringify(D))}catch(e){}};

let V={t:"home"};
const go=(t,x)=>{V=Object.assign({t},x||{});render();scrollTo(0,0)};

const total=()=>Object.keys(LESSONS).length;
const doneN=()=>Object.keys(D.done).filter(k=>D.done[k]).length;
function pick(l,q,o){D.ans[l]=D.ans[l]||{};if(D.ans[l][q]!==undefined)return;D.ans[l][q]=o;save();render()}

function addNote(){const t=document.getElementById("nt").value.trim(),b=document.getElementById("nb").value.trim();if(!t&&!b)return;D.notes.unshift({id:Date.now(),t:t||"Untitled",b,d:new Date().toLocaleDateString()});save();render()}
function delNote(id){if(confirm("Delete this note?")){D.notes=D.notes.filter(n=>n.id!==id);save();render()}}
/* Ages in millions of years (Ma). Approximate; check stratigraphy.org for revisions. */
const EARTH=4540;
const EONS=[[4540,4000,"#6b4a3a"],[4000,2500,"#8a6d4b"],[2500,538.8,"#a38f66"],[538.8,0,"#c9b38a"]];
const EVENTS=[
["Formation of Earth",4540,"Earth formed about 4,540 million years ago."],
["Oldest widely accepted evidence of life",3500,"Microbial structures and chemical traces from around 3,500 Ma. Older claims exist and are debated."],
["Great Oxidation Event",2400,"Free oxygen began to build up in the atmosphere, around 2,400 Ma."],
["Start of the Cambrian",538.8,"The Phanerozoic Eon begins. Boundary age follows the ICS chart and may be revised."],
["First land plants (approx.)",470,"Earliest evidence of land plants dates to the Ordovician, around 470 Ma."],
["First dinosaurs (approx.)",230,"The earliest dinosaurs appear in the Late Triassic, roughly 230 Ma."],
["Non-avian dinosaur extinction",66,"The end-Cretaceous mass extinction, about 66 Ma. Birds, which are living dinosaurs, survived."],
["Origin of Homo sapiens (approx.)",0.3,"The oldest fossils assigned to our species are about 300,000 years old."],
["Start of the Holocene",0.0117,"About 11,700 years ago. All written history sits inside this sliver."]];
let CK=6;
function clk(a){const s=(EARTH-a)/EARTH*86400,b=86400-s,p=n=>String(n).padStart(2,"0"),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=Math.floor(s%60);
return b<120?{t:p(h)+":"+p(m)+":"+p(c),n:b<1?"less than 1 second before midnight":b.toFixed(1)+" seconds before midnight"}:{t:p(h)+":"+p(m),n:""}}
function pt(f,r){const a=2*Math.PI*f;return[150+r*Math.sin(a),150-r*Math.cos(a)]}
function arc(f0,f1,col){const p=pt(f0,104),q=pt(f1,104);return `<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)} A104 104 0 ${f1-f0>.5?1:0} 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="14"/>`}
function selClock(i){CK=i;render()}
function clockHTML(){const f=a=>(EARTH-a)/EARTH,e=EVENTS[CK],c=clk(e[1]);
const lab=[[150,24,"00:00"],[262,154,"06:00"],[150,284,"12:00"],[38,154,"18:00"]].map(l=>`<text x="${l[0]}" y="${l[1]}" fill="#a39a88" font-size="11" text-anchor="middle" font-family="system-ui">${l[2]}</text>`).join("");
const dots=EVENTS.map((x,i)=>{const p=pt(f(x[1]),104);return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===CK?7:4.5}" fill="${i===CK?"#ffffff":"#1c1b1a"}" stroke="#e8dfcc" stroke-width="2" onclick="selClock(${i})"/>`}).join("");
return `<div class="card"><h3>The Deep Time Clock</h3><p class="sub">Earth’s 4.54 billion years squeezed into one day. Midnight is the birth of Earth; the next midnight is today.</p>
<svg class="ck" viewBox="0 0 300 300">${EONS.map(x=>arc(f(x[0]),f(x[1]),x[2])).join("")}${lab}${dots}<text x="150" y="152" fill="#e8dfcc" font-size="${c.t.length>5?24:30}" text-anchor="middle" font-family="Georgia,serif">${c.t}</text><text x="150" y="172" fill="#a39a88" font-size="10" text-anchor="middle" font-family="system-ui">on the 24-hour clock</text></svg>
<h3>${e[0]}</h3><div class="tag">${e[1]} Ma · ${c.t}${c.n?" ("+c.n+")":""}</div><p class="sub">${e[2]}</p>
${EVENTS.map((x,i)=>`<div class="ev tap ${i===CK?"on":""}" onclick="selClock(${i})"><b>${clk(x[1]).t}</b><span>${x[0]}</span></div>`).join("")}
<div class="tag" style="margin-top:8px">Ring colours: Hadean, Archean, Proterozoic, Phanerozoic. Tap a dot or a row.</div></div>`}
const PLAN={fossil2:"History and development of paleontology",fossil3:"Body fossils and trace fossils",fossil6:"Exceptional fossil preservation and Lagerstätten",fossil7:"Fossil record completeness and preservation biases",fossil8:"Scientific interpretation of fossil evidence",fossil9:"Major historical discoveries in paleontology",fossil10:"Introduction to paleontological research methods"};
Object.assign(LESSONS,{
fossil4:{title:"Fossilization processes and preservation mechanisms",
obj:["Describe how burial and diagenesis change a dead organism’s tissues.","Explain permineralization, replacement, recrystallization, molds and casts, and carbonization in chemical terms.","Explain why bone, shell, wood and soft tissue preserve differently.","Judge what each preservation mode can and cannot tell us."],
sec:[
["Starting materials",["The raw material matters. Bone is mainly bioapatite, a calcium phosphate mineral, together with collagen protein. Many shells are calcium carbonate (CaCO3) as calcite or aragonite. Arthropod cuticle contains chitin; wood contains cellulose and lignin. Organic molecules such as collagen break down far faster than minerals, so most fossils are mineral records rather than preserved tissue.","Calcite and aragonite share the formula CaCO3 but have different crystal structures. Aragonite is less stable and often dissolves or converts to calcite during burial. This is one reason that some fossil shells survive only as molds, and others as calcite copies."]],
["Burial and diagenesis",["Diagenesis is the set of physical and chemical changes in sediment and buried remains after burial, short of metamorphism. As sediment piles up, pressure and temperature rise and pore waters change chemistry.","Key ideas. Porosity is the fraction of a rock or bone that is empty space. Groundwater is water filling pores below the water table. Dissolution is a mineral dissolving into water. Precipitation is a dissolved substance leaving solution as a solid, which happens when the water becomes supersaturated. Cementation is precipitation that binds sediment grains into rock."]],
["Mechanisms of preservation",["Permineralization: groundwater carries dissolved minerals, such as silica or calcite, into pores. Minerals precipitate inside the pores. The original tissue structure often remains, so thin sections of bone or wood can show cells and growth rings. Petrified wood is usually permineralization, often with some replacement.","Replacement: original material dissolves while another mineral precipitates in its place, sometimes at the scale of single cells. Examples are silicification of shells and pyritization, where iron sulfide replaces tissue.","Recrystallization: the same mineral re-forms into different crystals. Fine detail can be lost even though the mineral is unchanged.","Molds and casts: if a shell dissolves it leaves a mold, an impression of its shape. Sediment or minerals filling the mold form a cast. An internal mold records the inside of the shell.","Carbonization (compression): heat and pressure drive off volatile elements and leave a thin carbon film. This is common in fossil leaves and in some soft-bodied animals.","Other pathways: amber is fossilized plant resin that can entomb small organisms in fine detail. Freezing preserves carcasses in permafrost, but only in geologically young cases such as Pleistocene mammoths."]],
["Controls on preservation",["Preservation depends on tissue composition, burial speed, oxygen level, acidity (pH), microbial activity, pore-water chemistry, temperature and time. Rapid burial greatly improves the odds, but it is not required for every pathway.","Reports of original proteins or soft-tissue structures in some dinosaur bones are an active scientific debate. Interpretations include original biomolecules, microbial biofilm, and contamination. No such claim should be treated as settled from a single paper."]],
["What each mode tells us",["Permineralized bone can reveal internal structure and growth. Carbon films can reveal outline and soft-part shape but little internal anatomy. Molds reveal surface detail but not original composition. Always ask which kinds of information the preservation mode has erased."]]],
terms:[["Bioapatite","The calcium phosphate mineral that makes up bone and teeth."],["Porosity","Fraction of a material that is empty space."],["Precipitation","A dissolved substance forming a solid from solution."],["Recrystallization","Same mineral, new crystal structure."],["Internal mold","Impression of the inside of a shell, often filled with sediment."],["Carbonization","Preservation as a thin carbon film."]],
mis:["“Petrified wood is wood turned into stone atom by atom.” Often minerals fill the pores first, with some replacement later.","“Fossilization needs millions of years.” The mineral changes can begin soon after burial; age is a separate matter.","“All fossils are replaced by minerals.” Some retain original mineral material, and a few are frozen or in amber."],
sum:["Diagenesis changes remains after burial through dissolution, precipitation and recrystallization.","Permineralization fills pores; replacement swaps minerals; recrystallization changes crystals.","Carbon films, molds, amber and freezing preserve different information.","Each preservation mode limits what we can conclude."],
q:[
["Groundwater deposits silica inside the pores of buried wood, keeping cell structure visible. Which process is this?",["Replacement only","Permineralization","Carbonization","Recrystallization"],1,"Minerals precipitated into open pores. Replacement would dissolve the original material while swapping in a new mineral."],
["Why can an aragonite shell be missing from a rock that still holds its mold?",["Aragonite is more stable than calcite","Aragonite can dissolve or convert to calcite during burial","Molds only form in amber","Shells never dissolve"],1,"Aragonite is less stable, so pore waters can dissolve it, leaving an impression in the rock."],
["Which preservation mode best records the outline of a thin fern frond?",["Carbonization","Permineralization of bone","Freezing","Amber"],0,"Carbonization leaves a thin carbon film that records outline. The others suit different materials."],
["A paper reports possible dinosaur proteins. What is the best response?",["Accept it as settled","Reject it because DNA decays","Treat it as an active debate and check whether contamination and microbes were excluded","Ignore all soft-tissue studies"],2,"Extraordinary claims need independent confirmation, and alternative explanations must be tested."]],
refs:[["Briggs, D.E.G. (2003). The role of decay and mineralization in the preservation of soft-bodied fossils. Annual Review of Earth and Planetary Sciences 31: 275–301. (check details)","https://scholar.google.com/scholar?q=Briggs+2003+role+of+decay+and+mineralization+in+the+preservation+of+soft-bodied+fossils"],["OpenStax, Biology 2e","https://openstax.org/details/books/biology-2e"]]},
fossil5:{title:"Taphonomy: from death to discovery",
obj:["Describe the stages between death and discovery.","Explain how decay, scavenging, transport and weathering change the evidence.","Separate observations from taphonomic inferences on a specimen.","Explain why fossil abundance in a region is not simple past abundance."],
sec:[
["The taphonomic pathway",["Taphonomy was named by the Russian paleontologist Ivan Efremov in 1940. It studies everything that happens to remains between death and discovery. The usual sequence is: death, decay, scavenging, disarticulation, transport, burial, diagenesis, exposure, discovery.","Biostratinomy covers the events from death up to final burial. Fossildiagenesis covers changes after burial. Each stage filters the evidence, so the fossil assemblage is a biased sample of the living community."]],
["Decay, scavenging and disarticulation",["Soft tissue decays at rates that depend on temperature, oxygen, body size and microbes. As ligaments and muscle decay, a skeleton falls apart: this is disarticulation. Scavengers may remove, break and scatter bones, leaving tooth marks that can be compared with the bite of living carnivores.","A skeleton with bones still in anatomical contact is articulated. If bones from one individual lie close together but out of position, they are associated. Isolated bones tell the least about the death event."]],
["Transport and sorting",["In flowing water, different bones move differently. Experiments with small mammal carcasses by J.R. Voorhies grouped bones by how easily water moves them: ribs and vertebrae move first, limb bones more gradually, and skulls and jaws tend to stay behind as lag deposits. The idea is a useful guide, not a rule, because bone shape, density and flow conditions vary.","Sorting can create assemblages that never existed in life. A deposit rich in small, light bones may reflect water currents, not the original community."]],
["Weathering, burial and exposure",["Bones exposed on a land surface crack and flake. Behrensmeyer’s weathering stages, developed from bones in Amboseli, Kenya, grade this from stage 0 (fresh) to stage 5 (falling apart). Heavily weathered bone suggests long surface exposure before burial.","After burial, diagenesis acts. Erosion later exposes the fossil, and the exposed fossil begins to weather again. A paleontologist must recognize damage that happened before burial, after burial, and during recovery."]],
["Observation versus inference",["Observation: the bones lie in one layer, several are broken, and ribs are missing. Inference: perhaps flowing water removed the lighter elements, or scavengers broke them. To test these ideas, check the sediment for current structures, compare break patterns with scavenger damage, and map where each bone lies."]],
["The Sri Lankan context",["Around 90 percent of Sri Lanka’s bedrock is Precambrian crystalline rock, which does not hold fossils of this kind. Jurassic, Miocene and Quaternary sedimentary strata are mostly confined to a thin belt in the north and northwest (Edirisooriya et al., Geological Magazine).","One example is the small Tabbowa Basin in the Northwestern Province, where Jurassic plant fossils such as the fern Cladophlebis are preserved as impressions in mudstone. Plant macrofossil records in Sri Lanka are sparse, and a Permian Glossopteris flora has also been reported from a small exposure there.","This links to taphonomy. Few fossils from Sri Lanka compared with North America does not show fewer organisms lived here. Exposed sedimentary rock, collecting effort and research history all differ. This is a geological availability and sampling bias, covered more fully later."]]],

const F1=LESSONS.fossil1,F4=LESSONS.fossil4,F5=LESSONS.fossil5;
F1.sec.splice(2,0,
["Classifying fossils",["Body fossils are remains of the organism itself. Trace fossils (ichnofossils) are evidence of what an organism did. Chemical fossils (biomarkers) are organic molecules, such as steranes and hopanes, whose structure points to a biological source; their interpretation can be debated, especially in very old rocks. Microfossils are defined by size, not type, and can belong to any group. Some structures, such as stromatolites built by microbial communities, are biological in origin, though the origin of some of the oldest examples has been debated.","The key distinction is between biological remains and evidence of biological activity. A coprolite contains remains of food, but as an object it records feeding and digestion, so it is classed as a trace."]],
["Naming trace fossils: ichnotaxonomy",["Body fossils are named with biological taxonomy, which classifies the organism. Trace fossils are named by ichnotaxonomy, which classifies the structure by its form. The names are ichnogenera and ichnospecies, such as Skolithos (vertical tube-like burrows) or Cruziana (bilobed furrows made by arthropods).","Form is used because one animal can make different traces, and different animals can make similar ones. Small three-toed footprints placed in the ichnogenus Grallator are attributed to theropod-like dinosaurs, but a footprint rarely identifies a species. The producer of a trace is therefore an inference."]],
["Examples from different ages",["Ediacaran assemblages come from the period just before the Cambrian. Trilobites range from the Cambrian to the end of the Permian. Archaeopteryx comes from the Late Jurassic Solnhofen Limestone, and mammoth remains come from the Pleistocene. Each example preserves different information, so each answers different questions."]]);
F1.mis.push("“A trace fossil identifies the animal that made it.” Usually it identifies only a kind of behaviour and, at best, a group of possible producers.");
F1.terms.push(["Ichnotaxonomy","Naming and classifying trace fossils by their form."],["Chemical fossil (biomarker)","An organic molecule whose structure points to a biological source."]);
F1.sa=[["Explain the difference between an observation and an inference, using a fossil tooth as an example.","Observation: features that can be described or measured, such as size, shape and serrated edges. Inference: a conclusion drawn from them, such as diet. An inference needs further support, such as wear patterns, comparison with living animals, and geological context."]];
F4.sec.splice(3,0,
["Related processes that are not interchangeable",["These terms describe different things and should not be used as synonyms. Dissolution removes mineral into undersaturated water. Compaction is physical flattening under the weight of overlying sediment; it can crush shells and flatten carbon films. Permineralization fills pore space. Replacement swaps one material for another. Recrystallization changes crystal structure without changing the mineral. Authigenic minerals are minerals that form in place within the sediment during or after burial, such as pyrite, phosphate and cements; they can fill voids or replace tissue, so authigenic describes where a mineral formed, not one specific mode of preservation.","Silicification is replacement or filling by silica (SiO2) as opal, chalcedony or quartz. It can preserve fine cellular detail, as in the Early Devonian Rhynie chert of Scotland, which preserves early land plants and small animals.","Pyritization occurs in oxygen-poor sediment. Sulfate-reducing bacteria produce hydrogen sulfide, which reacts with dissolved iron to form iron sulfides and finally pyrite (FeS2). It can preserve delicate parts, as in Beecher’s Trilobite Bed (Ordovician, New York State), where trilobite legs are preserved in pyrite.","Phosphatization is precipitation of calcium phosphate in and around decaying tissue where the local chemistry favors it. It can preserve fine soft-tissue detail, but only where those conditions arise."]]);
F4.sec.splice(4,0,["Comparison: what each mechanism keeps or loses",[T([["Mechanism","Tends to keep","Tends to lose"],["Permineralization","Internal structure (bone histology, wood cells) and 3D form","Most original organic material"],["Replacement","Surface detail; sometimes fine soft-tissue structure","Original chemistry; some microstructure"],["Recrystallization","Overall shape","Fine microstructure"],["Mold and cast","External surface and shape","Internal structure and composition"],["Carbonization","Outline and some soft parts","3D form (flattened) and internal detail"],["Amber","Fine 3D detail of small organisms","Large organisms (rarely trapped)"],["Freezing or drying","Soft tissue, hair, stomach contents","Only geologically young cases exist"]])]]);
F4.terms.push(["Authigenic mineral","A mineral formed in place within sediment during or after burial."],["Compaction","Flattening of sediment and remains under the weight of overlying layers."]);
F4.sa=[["Explain why aragonite shells are less likely than calcite shells to survive unchanged.","Aragonite is less stable under burial conditions. Pore waters can dissolve it or it can convert to calcite. This can leave only a mold, or a recrystallized shell that has lost fine microstructure."]];
F5.sec[2][1][1]=F5.sec[2][1][1].replace("The idea is a useful guide, not a rule, because bone shape, density and flow conditions vary.","This is a useful guide, not a universal rule: transport depends on bone shape, density, orientation and water-flow conditions.");
F5.sec.splice(4,0,
["Abrasion, bioerosion and bioturbation",["Abrasion is rounding and polishing of remains by moving sediment. Bioerosion is removal of hard material by organisms, such as borings made by sponges, worms or bivalves, or gnawing by animals. Bioturbation is mixing of sediment by burrowing animals; it can move fossils vertically and destroy fine layering."]],
["Time-averaging and reworking",["Sediment often accumulates slowly, so one bed can contain remains of organisms that lived over decades to thousands of years or more. This is time-averaging. It mixes generations and, because durable remains accumulate, it can make a fossil assemblage look more diverse and more mixed than any living community at one moment.","Reworking is erosion of older fossils from their original deposit and redeposition in younger sediment. Clues include abrasion, a different preservation style or color from the surrounding fossils, and an age that conflicts with the other fossils present."]],
["Does an assemblage show a living community?",["Usually not at one precise moment. A life assemblage (biocoenosis) is the community that lived together. A death assemblage (thanatocoenosis) is what accumulates after death, and it is filtered by decay, transport, mixing and preservation. Paleontologists compare the death assemblage with living communities and use quantitative measures, such as the proportion of articulated skeletons, fragmentation and size sorting, to judge how closely it reflects life."]]);
F5.sec.splice(F5.sec.findIndex(x=>x[0]==="The Sri Lankan context"),1,["The Sri Lankan context",["Around 90 percent of Sri Lanka’s bedrock is Precambrian crystalline rock (Edirisooriya et al., 2018). This does not mean fossils cannot occur in the country. It means the exposed record is dominated by basement rocks, while fossil-bearing sedimentary strata of Jurassic, Miocene and Quaternary age are mostly confined to a thin belt in the north and northwest.","The small Tabbowa Basin in the Northwestern Province holds two plant records that must be kept apart. First, Jurassic plant fossils have been documented in earlier studies. Second, Edirisooriya, Dharmagunawardhane and McLoughlin reported the first Permian Glossopteris flora from Sri Lanka, from strata exposed near Tabbowa Tank. It includes Glossopteris, ferns and sphenophytes, and is interpreted as probably late Permian (Lopingian) by comparison with floras of peninsular India.","For taphonomy, the preservation mode and depositional setting of each deposit must be taken from its own papers, not assumed. Few fossils from Sri Lanka compared with North America does not show that fewer organisms lived here. Exposed sedimentary rock, collecting effort and research history all differ, which is an outcrop-availability and sampling bias."]]);
F5.terms.push(["Time-averaging","Mixing of remains from different times in one deposit."],["Reworking","Redeposition of older fossils in younger sediment."],["Bioturbation","Mixing of sediment by burrowing organisms."],["Biocoenosis / thanatocoenosis","A living community / the assemblage of its remains after death."]);
F5.mis.push("“A fossil assemblage is a snapshot of one moment.” Time-averaging and mixing mean it usually combines many moments.");
F5.refs[1]=["Edirisooriya, G., Dharmagunawardhane, H.A. and McLoughlin, S. (2018; online 2016). The first record of the Permian Glossopteris flora from Sri Lanka: implications for hydrocarbon source rocks in the Mannar Basin. Geological Magazine 155(4): 907–920.","https://doi.org/10.1017/S0016756816001114"];
F5.sa=[["Why might a fossil assemblage not represent a community that lived at one moment?","Time-averaging can combine remains from different generations or periods. Transport and sorting can add or remove elements. Reworking can bring in older fossils. Differential preservation favors durable remains. So the death assemblage is a filtered, mixed sample of life."]];

(function(){const L=LESSONS.fossil1;
const i=L.sec.findIndex(x=>x[0]==="Classifying fossils");
L.sec.splice(i,2,
["Classifying fossils",["Body fossils are remains of the organism itself, whether as original material or as a mineral copy of it. Trace fossils (ichnofossils) record what an organism did, such as footprints, burrows, bite marks and coprolites. Chemical fossils (biomarkers) are organic molecules in rocks whose structure points to a biological source. Microfossils are defined by size, not by type, and can belong to any of these groups.","The key distinction is between biological remains and evidence of biological activity. A coprolite contains remains of food, but as an object it records feeding and digestion, so it is classed as a trace."]],
["Chemical fossils: biomarkers",["Steranes are stable hydrocarbons derived from sterols, lipids that eukaryotes use in their cell membranes. Hopanes derive from hopanoids, lipids made by many bacteria. After an organism dies, its lipids are altered during burial (diagenesis). Reactive chemical groups are lost and bonds are saturated, and what survives is a stable hydrocarbon skeleton that can last for hundreds of millions of years.","Interpretation needs care. The molecules can be contaminants, introduced by drilling, handling, or later fluids moving through the rock. Some structures are not specific to one group: later studies showed that some hopane types once linked to cyanobacteria are not unique to them. Heat can also alter the molecules, and some compounds can have non-biological sources.","A well-known case: biomarkers reported from roughly 2.7-billion-year-old shales in Western Australia were first read as evidence for cyanobacteria and eukaryotes. Rasmussen and colleagues (2008) analysed the carbon isotopes at very small scale and argued that the molecules entered the rocks much later, so the oldest unambiguous evidence is younger. Scientists therefore want several independent lines of evidence: proof that the molecules are as old as the rock, consistent isotope data, plausible biological patterns, and supporting geology or microfossils."]],
["Stromatolites: structure versus organism",["Stromatolites are laminated, accretionary sedimentary structures. They are commonly associated with microbial mats and biofilms that trap sediment or promote mineral precipitation. Their record is traced back to about 3.5 billion years ago, so they are among the oldest putative evidence of life.","The structure is not the organism. Stromatolites rarely contain fossil microbes, so a biological origin is often inferred by comparison with modern examples. Grotzinger and Rothman (1996) showed that the geometry of some ancient stromatolites can be reproduced by a purely abiotic growth model. Shape alone therefore does not prove biology. The biogenicity of some ancient examples is debated, and it is assessed from lamina textures, geochemistry, any microfossils, and geological setting."]],
["Naming trace fossils: ichnotaxonomy",["Body fossils are named with biological taxonomy, which classifies the organism. Trace fossils are named with ichnotaxonomy, which classifies the structure, mainly by its form (Bertling et al., 2006). Ichnotaxa, meaning ichnogenera and ichnospecies, must not be incorporated into biological taxa.","Skolithos is an ichnogenus for vertical, tube-like burrows. Cruziana is an ichnogenus for bilobed furrows usually attributed to arthropods. Grallator is an ichnogenus for small three-toed footprints, often attributed to small theropod-like trackmakers. Grallator is a name for a kind of footprint, not a genus of dinosaur.","The producer is an inference. Different organisms can make similar traces. One organism can make different traces depending on whether it is walking, resting or feeding, and on the sediment. Bertling and colleagues rejected producer, size and age as bases for naming ichnotaxa, because the name classifies the trace, not the animal."]],
["Fossil names and type specimens",["Fossil animals are named under the International Code of Zoological Nomenclature (ICZN), and fossil plants under the International Code of Nomenclature for algae, fungi, and plants. A new species is formally established in a published work. The scientific description sets out the characters of the specimens. The diagnosis lists the features that distinguish the new taxon from similar ones.","Under the ICZN, the single specimen on which a new species is based in the original publication is the holotype (Article 73.1). When a holotype is designated, the other specimens of the type series are paratypes (Article 72.4.5). Type specimens are the standards of reference for the name. If later scientists disagree about what the species is, they return to the type.","Every specimen in a collection has a catalog number, usually an institution code plus a number. The number lets other researchers find the exact specimen, re-examine it and test the original claim. This is why permanent museum collections are essential to reproducible paleontology.","Identifications are sometimes uncertain. Open nomenclature uses qualifiers to say so honestly: cf. means compare with, aff. means affinity with, and sp. means species not determined. Glossopteris sp. means a Glossopteris specimen not identified to species."]]);
const j=L.sec.findIndex(x=>x[0]==="Examples from different ages");
L.sec.splice(j+1,0,["Where this is developed further",["Preservation chemistry is developed in Lesson 2 and in the course Fossilization and Taphonomy. Biomarkers and early life return in Precambrian Life. Naming, type specimens and classification are developed in Systematics and Phylogenetics."]]);
L.obj.push("Explain how biomarkers and stromatolites are interpreted, and why their biological origin is sometimes debated.","Explain how fossils are named, and why type specimens and museum numbers matter.");
L.terms.push(["Sterane / hopane","Stable hydrocarbons derived from sterols (eukaryote lipids) and hopanoids (bacterial lipids)."],["Stromatolite","Laminated sedimentary structure commonly associated with microbial communities."],["Holotype","The single specimen on which a new species is based in its original publication."],["Paratype","Another specimen of the type series, once a holotype is designated."],["Diagnosis","The features that distinguish a taxon from similar ones."],["Open nomenclature","Qualifiers such as cf., aff. and sp. that show uncertain identification."]);
L.mis.push("“Stromatolites are fossilized bacteria.” They are laminated sediment structures commonly linked to microbial communities, and the link must be tested.","“A biomarker proves when a group of organisms lived.” The molecules can be younger than the rock that contains them.");
L.q[0][4]=["A petrified trunk is part of the organism itself, even though minerals have filled or replaced it, so it is a body fossil.","","Replacement changes the material, but the object is still a copy of the organism’s own shell, so it is a body fossil.","The insect is the organism’s own body preserved in resin, so it is a body fossil."];
L.q[1][4]=["Soft-bodied organisms are known from older rocks. Their rarity reflects poor preservation, not absence.","","Fossils also form on land, for example in lakes, floodplains, caves and volcanic ash.","Abundance in life and abundance in the record are different things, and this claim is not established."];
L.q[2][4]=["Carbonization leaves a thin carbon film. It does not fill pores with minerals.","","Freezing preserves tissue without mineral filling.","A mold is an impression left after the original dissolves. It is not a filling of the tissue’s pores."];
L.q[3][4]=["All empirical science uses incomplete data. The question is how large the gaps are and what caused them.","The record is not complete even for marine life.","","Fossils are reliable evidence when their limits are understood."];
L.q.push(
["Which statement about stromatolites is best supported?",["They are fossilized cells of cyanobacteria","They are laminated sedimentary structures commonly associated with microbial communities, and a biological origin must be assessed","They are always formed without microbes","They are trace fossils made by burrowing animals"],1,"The structure is not the organism, and some ancient examples can be modeled without biology, so origin is judged from several lines of evidence.",["Stromatolites rarely contain fossil microbes, so they are not bodies of cells.","","Abiotic models show that some may form without microbes. That does not mean all do, so each case must be tested.","They are sedimentary structures, not traces of animal behavior."]],
["Hopane biomarkers are found in a 2.7-billion-year-old shale. What is the best next step?",["Accept it as proof that cyanobacteria existed then","Test whether the molecules are as old as the rock and look for independent evidence","Reject all biomarker evidence in every rock","Conclude that hopanes are made only by cyanobacteria"],1,"Contamination and alteration are real risks, so age and source must be tested with independent evidence.",["One line of evidence can be undermined by contamination, so acceptance without testing is premature.","","Many biomarker results survive careful testing. The lesson is to test, not to reject everything.","Hopanoids are made by many bacteria, and some hopane types are not unique to cyanobacteria."]],
["What is Grallator?",["A genus of small dinosaur","An ichnogenus, a name for a kind of footprint based on its form","A species of theropod","A type of coprolite"],1,"Ichnotaxa classify traces by form and must not be incorporated into biological taxa.",["It names a footprint type, not an animal. The animal that made it is an inference.","","Species and genera of animals are named from body fossils. Ichnotaxa are separate.","It classifies footprints, not droppings."]],
["A paper names a new species from one specimen. What is that specimen called?",["Paratype","Holotype","Neotype","Cotype"],1,"The single specimen on which a new species is based in the original publication is the holotype (ICZN Art. 73.1).",["A paratype is any other specimen of the type series once a holotype is designated.","","A neotype is a replacement type designated later when no name-bearing type exists.","Cotype is an old term that the Code advises authors to avoid."]]);
L.sa.push(
["Why can a footprint ichnogenus not be treated as a dinosaur genus?","Ichnotaxa are named from the form of the trace, not from the animal. Different animals can make similar traces and one animal can make different traces, so the producer is an inference. Ichnotaxa must not be incorporated into biological taxa."],
["What is the difference between a holotype and a paratype, and why do museum specimen numbers matter?","A holotype is the single specimen on which a new species is based in the original publication. Paratypes are the other specimens of the type series. A catalog number lets other researchers find the exact specimen, re-examine it and test the original claim, which makes the work reproducible."],
["(Explanation) Explain why the biogenicity of some ancient stromatolites is debated.","Stromatolites are laminated structures that rarely contain fossil microbes. Abiotic models can reproduce similar shapes (Grotzinger and Rothman, 1996), so shape alone is not proof of biology. Origin must be tested with textures, geochemistry, microfossils and geological context."],

const start=["Starting materials",[get("Starting materials")[1][0],"Calcite and aragonite share the formula CaCO3 but have different crystal structures. At Earth-surface temperature and pressure, calcite is the thermodynamically stable form and aragonite is metastable. Aragonite is more soluble, so over time it tends to dissolve or convert to calcite. Whether this happens depends on pore-water chemistry (how saturated the water is with respect to each mineral, its acidity, and ions such as magnesium) and on burial conditions. Aragonitic shells survive in some rocks and are lost in others.","Cherns and Wright (2000) argued that in a Silurian succession on Gotland, Sweden, early dissolution removed most aragonitic mollusc shells from many beds, so the molluscan fauna is greatly underrepresented there. This is a taphonomic bias. It is not evidence that molluscs were rare."]];
const orig=["Original material or mineral copy?",["Five situations must be kept apart. (1) Original mineral material survives, as in some young shells. (2) Original organic material, or its altered residue, survives, as in the Burgess Shale carbon films and some cuticle (Butterfield, 1990; Briggs, 2003). (3) Mineral infilling: new minerals fill empty spaces such as pores and cavities while the original structure remains. (4) Mineral replacement: the original material dissolves and another mineral takes its place. (5) A mineral replica: a coating or cast reproduces the form of structures whose original material has gone.","A fossil can therefore show excellent anatomical detail even when none of its original biological material remains. A visible structure does not prove that original tissue is present."]];
const mech=["Mechanisms of preservation",["Permineralization: groundwater carries dissolved minerals, such as silica or calcite, into pores, where they precipitate. The original tissue structure often remains, so thin sections of bone or wood can show cells and growth rings. Petrified wood is usually permineralization, often with some replacement.","Replacement: original material dissolves while another mineral precipitates in its place, sometimes at the scale of single cells.","Recrystallization: the same mineral re-forms into different crystals. Fine detail can be lost even though the mineral is unchanged.","Molds and casts: a dissolved shell leaves a mold, an impression of its shape. Sediment or minerals filling the mold form a cast. An internal mold records the inside of the shell.","Carbonization (carbon-film preservation): organic tissue is converted into a thin, carbon-rich film. Three things contribute: partial decay, which removes the most labile compounds; compaction, which flattens the remains; and chemical alteration of the organic matter during burial, which breaks down biopolymers and drives off hydrogen, oxygen and nitrogen while carbon-rich residue remains. Heat and pressure play a part but do not explain carbon films alone. Butterfield (1990) found that most Burgess Shale soft-bodied fossils (Middle Cambrian, British Columbia) are primary, kerogenized organic carbon, and attributed their preservation to clay–organic interactions as the animals were buried in fine clay.","Other pathways: amber is fossilized plant resin that can entomb small organisms in fine detail. Freezing preserves carcasses in permafrost, but only in geologically young cases such as Pleistocene mammoths."]];
const rel=["Related processes that are not interchangeable",["Dissolution removes mineral into undersaturated water. Compaction is physical flattening under overlying sediment. Permineralization fills pores. Replacement swaps materials. Recrystallization changes crystal structure only. Authigenic describes minerals that form in place within the sediment during or after burial. It says where and when a mineral formed, not how a fossil was preserved. Authigenic pyrite, phosphate, silica and carbonate can fill pores, replace tissue, coat remains or cement the sediment, so authigenic is not a single fossilization mechanism.","Silicification is replacement or filling by silica (SiO2) as opal, chalcedony or quartz. It can preserve fine cellular detail, as in the Early Devonian Rhynie chert of Scotland, which preserves early land plants and small animals.","Pyritization needs sulfide, produced by microbes in oxygen-poor sediment, and dissolved iron. Pyrite can precipitate on, within or around decaying tissue. Sometimes it coats surfaces, sometimes it fills cavities, and sometimes it replaces part of the tissue, so it is not always a one-for-one replacement of the original material. In Beecher’s Trilobite Bed (Upper Ordovician, New York State), Briggs, Bottrell and Raiswell (1991) described soft parts such as legs preserved in three dimensions in pyrite."]];
const exc=["Exceptional preservation: early mineralization and phosphatization",["In many exceptional deposits, minerals precipitate while the tissue is still decaying, within a short time of burial. Decay microbes change the chemistry around a carcass, and minerals such as calcium phosphate or pyrite can precipitate there. The tissue shape is fixed only if mineral precipitation keeps pace with decay, so rapid precipitation is essential.","Briggs (2003) distinguishes organic preservation, where decay is slowed enough for original biomolecules or their residues to survive, from authigenic mineralization, which relies on the activity of decaying microbes. Phosphatization is precipitation of calcium phosphate in and around tissue. It can preserve fine soft-tissue detail, but only under narrow chemical conditions. Which pathway operated in a deposit is a hypothesis that must be tested with microscopy and geochemistry."]];
const tab=["Comparison: what each mechanism keeps or loses",[T([["Mechanism","Tends to keep","Tends to lose"],["Permineralization","Internal structure (bone histology, wood cells) and 3D form","Most original organic material"],["Replacement","Surface detail; sometimes fine structure","Original chemistry; some microstructure"],["Recrystallization","Overall shape","Fine microstructure"],["Mold and cast","External surface and shape","Internal structure and composition"],["Carbonization","Outline, some soft parts, sometimes fine surface detail","3D form (flattened) and internal detail"],["Pyritization or phosphatization","3D soft-tissue detail in some cases","Original chemistry; needs special conditions, so rare"],["Amber","Fine 3D detail of small organisms","Large organisms (rarely trapped)"],["Freezing or drying","Soft tissue, hair, stomach contents","Only geologically young cases exist"]])]];
const cross=["Where this is developed further",["Taphonomy (Lesson 3) covers what happens before burial. Exceptional preservation (Lesson 6) applies these mechanisms to named deposits. The course Fossilization and Taphonomy develops the geochemistry in depth."]];
L.sec=[start,get("Burial and diagenesis"),orig,mech,rel,exc,tab,get("Controls on preservation"),get("What each mode tells us"),cross];
L.obj.push("Distinguish original mineral, original organic material, mineral infilling, replacement and mineral replicas.","Explain why aragonite is generally less stable than calcite, and why pore-water chemistry matters.");
L.terms.push(["Metastable","Stable enough to persist for a time, but not the lowest-energy form (aragonite relative to calcite)."],["Mineral replica","A mineral copy of the form of a structure whose original material has gone."],["Early diagenetic mineralization","Mineral precipitation soon after burial, often while tissue is still decaying."]);
L.mis.push("“Authigenic means the same as permineralization.” It describes where a mineral formed, not one preservation mode.","“Heat and pressure make carbon films.” Decay, compaction and chemical alteration all contribute.","“A fossil with fine detail still contains the original tissue.” It may be a mineral replica.");
L.q[0][4]=["Replacement dissolves the original material and swaps in a new mineral. Here the minerals filled pores.","","Carbonization leaves a carbon film and does not fill pores.","Recrystallization changes the crystals of one mineral. It does not add new minerals into pores."];
L.q[1][4]=["Aragonite is the less stable, more soluble form.","","Molds form when a shell dissolves out of rock. Amber is unrelated.","Shells do dissolve, and early dissolution can remove aragonitic shells entirely."];
L.q[2][4]=["","Permineralization of bone fills pores and does not suit a thin leaf film.","Freezing is rare and recent. A frond in old rock is not frozen.","Amber entombs small organisms in resin. A flat frond film is not amber."];
L.q[3][4]=["A single report needs independent confirmation.","DNA decay is a different question from protein survival, and rejecting a claim without testing it is not evidence-based.","","Soft-tissue studies are valuable when they are tested carefully."];
L.q.push(
["Which statement about the term authigenic is correct?",["It is a fossilization mechanism equivalent to permineralization","It describes minerals that form in place within sediment, and such minerals can take part in several preservation modes","It applies only to pyrite","It means minerals transported from elsewhere"],1,"Authigenic says where a mineral formed. Pyrite, phosphate, silica and carbonate can be authigenic and can fill, replace, coat or cement.",["Permineralization is one way minerals can act. Authigenic is a broader category.","","Authigenic pyrite exists, but so do authigenic phosphate, silica and carbonate.","Minerals brought in from elsewhere are detrital, not authigenic."]],
["Butterfield (1990) studied the Burgess Shale. What did he conclude about most of its soft-bodied fossils?",["They are replaced by pyrite","They are primary, kerogenized organic carbon, preserved through clay–organic interactions","They are permineralized by silica","They are preserved in amber"],1,"Most Burgess Shale soft-bodied fossils are original organic carbon, altered by burial and protected by interaction with clay.",["Pyritization is typical of other deposits, such as Beecher’s Trilobite Bed.","","Silica permineralization characterizes other deposits, such as cherts.","Amber is fossil resin and is not involved in the Burgess Shale."]],
["Which description of pyritization is best supported?",["Heat and pressure convert tissue into pyrite","Microbial sulfide reacts with dissolved iron, so pyrite can precipitate on, within or around decaying tissue","Pyrite always replaces tissue one-for-one","Pyrite forms only in oxygen-rich seawater"],1,"Pyrite needs sulfide and iron. Its relation to the tissue varies, from coating to filling to partial replacement.",["Pyritization is chemical and microbial, not simply thermal.","","The relation to the tissue varies, so it is not always a simple one-for-one replacement.","Pyritization typically occurs in oxygen-poor sediments."]],
["A fossil shows excellent anatomical detail, but analysis finds no original organic material. Which conclusion is justified?",["It must be a forgery","The detail may be a mineral replica, because original biological material is not required for anatomical detail","The anatomy cannot be trusted","It is not a fossil"],1,"Replacement and replicas can keep form after the original material is gone. The detail is real evidence of form, though not of original chemistry.",["Mineral replicas are common, well-documented preservation, not forgery.","","The form can be reliable even when the chemistry is not original.","It is a fossil, preserved as a mineral copy."]]);
L.sa.push(
["Explain why carbon films cannot be explained by heat and pressure alone.","Decay removes the most labile compounds, compaction flattens the remains, and chemical alteration of organic matter during burial breaks down biopolymers and drives off volatile elements, leaving carbon-rich residue. In the Burgess Shale, clay–organic interactions helped preserve primary organic carbon (Butterfield, 1990)."],
["Distinguish permineralization, replacement and a mineral replica.","In permineralization, minerals fill pores while the original structure remains. In replacement, the original material dissolves and another mineral takes its place. A mineral replica is a mineral copy of a structure’s form after the original material has gone."],
["(Explanation) Explain why authigenic is not a fossilization mechanism on its own.","Authigenic describes minerals that form in place within sediment, not how a fossil was preserved. Authigenic minerals can fill pores, replace tissue, coat remains or cement sediment, so the same term covers several different preservation modes."],
["(Observation versus inference) A trilobite leg is preserved in pyrite with fine spines but no original cuticle. State what is observed and what can and cannot be inferred.","Observed: a leg-shaped pyrite structure with spines. Can be inferred: the form and 3D arrangement of the leg. Cannot be inferred: the original chemistry, since no cuticle remains. Pyrite may have formed on, within or around the tissue, which needs microscopy or geochemistry to test."]);
L.ex={t:"Specimen interpretation: how was this fossil preserved?",d:"Choose a museum photograph of a petrified wood, a shell mold, a carbon-film leaf or a pyritized fossil. Answer in your own words.",p:["What is directly observable (shape, color, surface, any original material)?","Which preservation modes might this be, and what supports each?","Is the visible structure original material, infilling, replacement or a mineral replica?","What information has this preservation mode erased?","What test would separate your hypotheses, for example a thin section or chemical analysis?","Which conclusions would be unjustified?"]};

["Butterfield, N.J. (1990). Organic preservation of non-mineralizing organisms and the taphonomy of the Burgess Shale. Paleobiology 16(3): 272–286.","https://doi.org/10.1017/S0094837300009994","Verified primary research"],

["Palmer, T.J., Hudson, J.D. and Wilson, M.A. (1988). Palaeoecological evidence for early aragonite dissolution in ancient calcite seas. Nature 335: 809.","https://www.nature.com/articles/335809a0","Verified primary research"],

const sec=(t,p)=>{get(t)[1]=p};
sec("Decay, scavenging and disarticulation",[get("Decay, scavenging and disarticulation")[1][0],"A skeleton with bones still in anatomical contact is articulated. Bones found close together but out of position are associated. Association does not prove that the bones belong to one individual, because bones of several animals can be mixed. It is tested with evidence such as matching size and growth stage, how well joint surfaces fit, and whether any element is duplicated. Articulation is stronger evidence for a single individual than association, but both are hypotheses to be tested. Isolated bones tell the least about the death event."]);
sec("Transport and sorting",["In flowing water, different bones move differently. Michael R. Voorhies (1969) introduced a grouping of skeletal elements in a study of the Verdigre quarry, an early Pliocene bone concentration in the Valentine Formation of Nebraska, asking how the concentration formed. In outline, Group I elements such as ribs and vertebrae are moved readily, Group II elements such as limb bones move more gradually, and Group III elements, the skull and jaws, tend to be left behind as lag.","This is a useful guide, not a universal rule. Transport depends on bone shape, density, orientation, whether soft tissue or joints are still attached, the age of the animal, water velocity, and the sediment. The groups are a hypothesis to test against sedimentary evidence in each case.","Sorting can create assemblages that never existed in life. A deposit rich in small, light bones may reflect water currents, not the original community."]);
sec("Weathering, burial and exposure",["Bones exposed on a land surface crack and flake. Behrensmeyer’s weathering stages, developed from bones in Amboseli, Kenya, grade this from stage 0 (fresh) to stage 5 (falling apart).","Pre-burial weathering happens at the ancient land surface and is evidence about the ancient environment and how long bones lay exposed. Post-exposure weathering happens after erosion brings the fossil back to the surface, and is modern damage. A fossil can pass through more than one period of exposure. The distinction matters, because only pre-burial weathering informs us about the past. One clue is that cracks filled with matrix or cement that formed in the rock were open before burial, while fresh cracks cutting through both bone and matrix are younger.","After burial, diagenesis acts. A paleontologist must recognize damage that happened before burial, after burial, and during recovery."]);
sec("Time-averaging and reworking",["Sediment often accumulates slowly, so one bed can contain remains of organisms that lived at different times. This is time-averaging, and it varies enormously. In shell beds of Holocene chenier ridges, dating of shells within individual strata showed that time-averaging varied significantly among cheniers (Kowalewski, Goodfriend and Flessa, 1998). For terrestrial vertebrates, Behrensmeyer (1982) estimated that attritional bone assemblages in river deposits represent roughly 100 to 10,000 years, and are probably resolved only to about 1,000 years.","Time-averaging is both a limit and, sometimes, a benefit. Kidwell and Flessa (1995) noted that it commonly hides short-term variation over seasons or years, but can give an excellent record of the natural range of community composition over longer periods.","Reworking is erosion of older fossils from their original deposit and redeposition in younger sediment. The fossil’s age is the age of the organism, whereas the sediment’s age is the time of final deposition, so a reworked fossil can be much older than the rock around it. Clues include abrasion, a different preservation style or color from the surrounding fossils, and an age that conflicts with the other fossils present. The oldest fossil in a bed therefore does not date the bed. The youngest fossil that lived in place sets a maximum age, since sediment cannot be older than an organism it contains."]);
sec("Does an assemblage show a living community?",["Usually not at one precise moment. A life assemblage (biocoenosis) is the community that lived together. A death assemblage (thanatocoenosis) is what accumulates after death, and it is filtered by decay, transport, mixing and preservation.","Transport can also mix habitats. In river deposits, bones can come from floodplain land surfaces, floodplain deposits and the active channel (Behrensmeyer, 1982), so one bed can hold animals that lived in different places. Paleontologists compare death assemblages with living communities and use quantitative measures, such as the proportion of articulated skeletons, fragmentation and size sorting, to judge how closely an assemblage reflects life."]);
sec("The Sri Lankan context",["Around 90 percent of Sri Lanka’s bedrock is Precambrian crystalline rock (Edirisooriya et al., 2018). This does not mean fossils cannot occur in the country. It means the exposed record is dominated by basement rocks, while Jurassic, Miocene and Quaternary strata are largely confined to a thin belt in the north and northwest.","The small Tabbowa Basin, a graben covering a few square kilometres in the Northwestern Province, holds two plant records that must be kept apart. Earlier studies identified only Jurassic plants from small grabens in the northwest, and Tabbowa was considered to host only Jurassic strata. In 2016 Edirisooriya, Dharmagunawardhane and McLoughlin reported the first Permian Glossopteris flora from Sri Lanka, from strata exposed near Tabbowa Tank. The authors could not place these strata in a continuous section because exposures are poor and deeply weathered, so the relation between the Permian and Jurassic beds should not be assumed.","The authors report that the Permian plants are preserved predominantly as impressions within grey shale. No organic matter is preserved, but venation is well defined. The leaves are relatively complete, a few are torn along veins, and the assemblage is dominated by Glossopteris leaves, with other plants making up less than 5 percent each. From the fine-grained, fissile lithology and the relatively complete leaves, they infer deposition in a relatively quiet-water, lacustrine setting. The dense leaf accumulation is consistent with autumn leaf fall, typical of glossopterid assemblages. Deep weathering prevented extraction of spores and pollen, so the age, probably Lopingian (late Permian), rests on macrofossil comparison with Indian floras.","Glossopteris matters for paleogeography because its distribution was central to early arguments that the southern continents were once joined as Gondwana, and it had not been recorded from Sri Lanka before. The specimens are housed at the National Museum, Colombo (CNM SA.1 to SA.20), which links back to why museum numbers matter.","Few fossils from Sri Lanka compared with North America does not show that fewer organisms lived here. Exposed sedimentary rock, collecting effort and research history all differ, which is an outcrop-availability and sampling bias."]);
L.obj.push("Distinguish pre-burial from post-exposure weathering, and explain time-averaging and reworking.","Interpret the Tabbowa Permian plant fossils from the evidence in the original paper.");
L.terms.push(["Pre-burial weathering","Surface weathering of remains at the ancient land surface before burial."],["Post-exposure weathering","Modern weathering after erosion re-exposes a fossil."],["Impression fossil","An imprint of an organism in sediment, without original material."]);
L.mis.push("“Associated bones belong to one animal.” Association must be tested.","“The oldest fossil in a bed dates the bed.” Reworked fossils can be much older than the sediment.");
L.q[0][4]=["Missing bones usually reflect losses along the pathway, not absence in life.","","A transport hypothesis is not proof of a specific event such as a flood.","Observations support testable hypotheses. Saying nothing can be inferred ignores that."];
L.q[1][4]=["Mineralization happens after burial and says nothing about scavenging.","","Age says nothing about whether scavengers fed on the carcass.","Rock type describes the setting, not scavenging."];
L.q[2][4]=["","Fossils do not migrate. The issue is where rock is exposed and collected.","Regions differ greatly in the amount of exposed sedimentary rock.","The record is filtered by known processes. It is not random."];
L.q[3][1][1]="Long surface exposure, before burial or after later re-exposure, which must be distinguished";
L.q[3][3]="Deep cracking and flaking suggest extended surface exposure. Whether it came before burial or after later re-exposure must be checked, for example from sediment-filled cracks.";
L.q[3][4]=["Rapid burial would protect bone from surface weathering and give low stages.","","The depositional environment does not by itself produce weathering stages.","Permineralization occurs after burial and does not cause surface cracking and flaking."];
L.q.push(
["Several bones lie close together in one bed. Which statement is best?",["They must belong to one individual","They are associated, and whether they belong to one individual must be tested, for example by size, fit and duplicated elements","They cannot belong to one individual because they are disarticulated","Association is stronger evidence than articulation"],1,"Association is a hypothesis. Articulation is stronger evidence, but both are tested.",["Bones of several animals can be mixed in one bed.","","Disarticulated bones can still come from one individual.","Articulated bones in anatomical contact are generally stronger evidence than association."]],
["Dating shows that shells in one bed span several centuries. What does this illustrate?",["Reworking from older rocks","Time-averaging, the mixing of remains from different times in one deposit","An error, because beds are always deposited instantly","Bioturbation cannot move shells"],1,"Slow sedimentation lets remains from different generations accumulate in one bed.",["Reworking brings in fossils from older strata, usually much older. This is a spread within one accumulating bed.","","Many beds accumulate slowly, so this is expected, not an error.","Bioturbation can mix shells vertically."]],
["A bed contains a fossil much older than the sediment around it. What should be tested first?",["That the fossil is a forgery","That it was eroded from older strata and redeposited (reworking)","That the sediment is older than the fossil","That fossils cannot be older than sediment"],1,"A fossil’s age is the age of the organism, whereas the sediment’s age is the time of final deposition. The oldest fossil does not date the bed.",["Reworking is far more common and should be tested first.","","Sediment normally cannot be older than the organism it contains.","Fossils can be older than the sediment that holds them, through reworking."]],
["The Tabbowa Permian Glossopteris leaves are impressions in grey shale. Which statement is best supported by the original paper?",["They are permineralized","They are impressions in fine-grained shale, and the authors infer quiet-water, lacustrine deposition from the lithology and the relatively complete leaves","They are carbon films","They were preserved in amber"],1,"The paper reports impressions, no preserved organic matter, and a fine-grained, fissile lithology that the authors read as quiet-water deposition.",["The paper describes impressions, not permineralization.","","No organic matter is preserved, so they are not carbon films.","Amber is fossil resin and is not involved."]]);
L.sa.push(
["Explain the Voorhies groups and why they are not universal rules.","Voorhies (1969) grouped skeletal elements by how easily flowing water moves them: ribs and vertebrae move readily, limb bones more gradually, and skulls and jaws tend to remain as lag. Transport also depends on bone shape, density, orientation, attached tissue, animal age, water velocity and sediment, so the groups are hypotheses to test."],
["Distinguish pre-burial weathering from post-exposure weathering, and explain why it matters.","Pre-burial weathering happens at the ancient surface and informs us about the ancient environment and exposure time. Post-exposure weathering is modern damage after re-exposure. A fossil can have both, and confusing them gives wrong conclusions about the past."],
["(Explanation) Explain how reworking can make a fossil older than the sediment around it, and what this means for dating a deposit.","Erosion releases fossils from older strata and they are redeposited in younger sediment. The fossil’s age is the age of the organism, while the sediment’s age is the time of final deposition. The oldest fossil does not date the bed. The youngest fossil that lived in place gives a maximum age."],
["(Explanation) Explain why a death assemblage may contain organisms from different habitats.","Rivers and currents carry remains from several places into one deposit. In river deposits bones can come from floodplain surfaces, floodplain deposits and the channel (Behrensmeyer, 1982). Time-averaging adds remains from different times, so the assemblage is a mixed sample, not one community."],
["(Observation versus inference) State what the authors observed about the Tabbowa Permian plant fossils and what they inferred.","Observed: more than 20 slabs with leaf impressions in grey shale, no preserved organic matter, relatively complete leaves with a few torn along veins, and a fine-grained, fissile lithology. Inferred: quiet-water (lacustrine) deposition, an autumn leaf accumulation, and a probable Lopingian age from comparison with Indian floras."]);
L.ex2={t:"Sri Lankan case study: Tabbowa Permian plants",d:"Use the Edirisooriya, Dharmagunawardhane and McLoughlin (2018) paper, especially the section on plant taphonomy. Answer in your own words.",p:["Fossil preservation: how are the plants preserved, and what information survives or is lost?","Sediment type: what rock hosts them, and what does it suggest about water energy?","Depositional environment: what setting do the authors infer, and what evidence supports it?","Plant community: which plants dominate, and what does that suggest about the vegetation?","Gondwanan paleogeography: why is Glossopteris significant for linking Sri Lanka to Gondwana?","What is missing that would test their age and environment interpretations?"]};

["Documented","Permian Glossopteris flora","First reported in 2016 from strata exposed near Tabbowa Tank. It includes Glossopteris raniganjensis, Vertebraria australis (roots), Samaropsis sp. (seeds), the sphenophyte Paracalamites australis, Sphenophyllum leaf whorls (named S. emarginatum in the abstract and tentatively assigned to S. churulianum in the systematic section), and the fern Dichotomopteris lindleyi. Some Glossopteris leaves show arthropod feeding and egg-laying damage."],
["Documented","Preservation and specimens","More than 20 slabs from an outcrop about 1 km west of the Tabbowa Tank spillway. The plants are preserved predominantly as impressions within grey shale, with no organic matter preserved but venation well defined. Specimens are housed at the National Museum, Colombo (CNM SA.1 to SA.20)."],
["Interpretation","Depositional environment","The authors infer relatively quiet-water (lacustrine) deposition from the fine-grained, fissile lithology and the relatively complete leaves. The dense accumulation is consistent with autumn leaf fall."],
["Interpretation","Age","Probably Lopingian (late Permian), based on macrofossil comparison with Indian floras. Deep weathering prevented spore and pollen dating."],
["Interpretation","Mannar Basin hypothesis","The authors hypothesize that the offshore Mannar Basin may have begun in late Paleozoic to Triassic time, and that its unsampled basal strata may be Permian. They state that the Permian strata require re-evaluation of current models."],
["Open question","Relations and extent","Exposures are poor, so the Permian beds cannot be placed in a continuous section and their relation to the Jurassic beds is not established in the paper. The extent of the Permian strata, and what lies at the base of the Mannar Basin, remain unsampled."],
["Planned","Still to add","Miocene fossil-bearing formations, Quaternary fossil evidence, Sri Lankan paleobotany, research history, and the limits and opportunities for research. These will be added only from published sources. No locality will be listed until verified."]);

function restoreFile(fl){const f=fl&&fl[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{askRestore(JSON.parse(r.result))}catch(e){setMsg("That file is not a Deep Time backup.")}};r.readAsText(f)}
function askRestore(b){if(!b||b.app!=="deeptime"||!b.data){setMsg("That file is not a Deep Time backup.");return}const d=b.data,n=Object.keys(d.done||{}).filter(k=>d.done[k]).length;if(!confirm("Restore this backup? It has "+n+" completed lesson(s) and "+((d.notes||[]).length)+" note(s). It will replace the progress on this phone. A safety copy of the current progress is kept."))return;applyBackup(b)}

function undoRestore(){let p;try{p=JSON.parse(localStorage.getItem("dt1_prev"))}catch(e){}if(!p||!confirm("Go back to the progress you had before the last restore?"))return;const cid=D.cid;Object.keys(D).forEach(k=>delete D[k]);Object.assign(D,p);if(cid)D.cid=cid;fixD();save();setMsg("Previous progress is back.")}
function gsiLoad(){return new Promise((res,rej)=>{if(window.google&&google.accounts&&google.accounts.oauth2)return res();const s=document.createElement("script");s.src="https://accounts.google.com/gsi/client";s.onload=res;s.onerror=()=>rej(new Error("offline"));document.head.appendChild(s)})}
function gToken(){return new Promise(async(res,rej)=>{if(!D.cid){rej(new Error("Add your Client ID first (see the setup guide)."));return}try{await gsiLoad()}catch(e){rej(new Error("Could not reach Google. Check your internet."));return}try{google.accounts.oauth2.initTokenClient({client_id:D.cid,scope:"https://www.googleapis.com/auth/drive.appdata",callback:r=>r.access_token?res(r.access_token):rej(new Error(r.error||"Sign-in failed")),error_callback:e=>rej(new Error((e&&e.type)||"Sign-in was cancelled"))}).requestAccessToken()}catch(e){rej(new Error("Could not start Google sign-in."))}})}
async function gd(t,u,o){const r=await fetch(u,Object.assign({},o,{headers:Object.assign({Authorization:"Bearer "+t},(o&&o.headers)||{})}));if(!r.ok)throw new Error("Google Drive error "+r.status);return r}
async function findBk(t){const q=encodeURIComponent("name='deeptime-backup.json'"),r=await gd(t,"https://www.googleapis.com/drive/v3/files?spaces=appDataFolder&q="+q+"&fields=files(id,modifiedTime)");return(await r.json()).files||[]}
async function driveSave(){setMsg("Signing in…");try{const t=await gToken(),l=await findBk(t),body=JSON.stringify(snap());if(l.length){await gd(t,"https://www.googleapis.com/upload/drive/v3/files/"+l[0].id+"?uploadType=media",{method:"PATCH",headers:{"Content-Type":"application/json"},body})}else{const b="dtb",m="--"+b+"\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n"+JSON.stringify({name:"deeptime-backup.json",parents:["appDataFolder"]})+"\r\n--"+b+"\r\nContent-Type: application/json\r\n\r\n"+body+"\r\n--"+b+"--";await gd(t,"https://www.googleapis.com/upload/drive/v3/files?uploadType=multipart",{method:"POST",headers:{"Content-Type":"multipart/related; boundary="+b},body:m})}D.lastBk=Date.now();save();setMsg("Saved to your Google Drive.")}catch(e){setMsg(e.message)}}
async function driveLoad(){setMsg("Signing in…");try{const t=await gToken(),l=await findBk(t);if(!l.length){setMsg("No backup found in this Google account yet.");return}const r=await gd(t,"https://www.googleapis.com/drive/v3/files/"+l[0].id+"?alt=media");setMsg("");askRestore(await r.json())}catch(e){setMsg(e.message)}}
