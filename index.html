{n:"Year 2 · Evolutionary History",m:["Origin of Life","Precambrian Life","Cambrian Explosion","Paleozoic Evolution","Evolution of Terrestrial Ecosystems","Mesozoic Life","Dinosaur Paleontology","Evolution of Birds","Mammalian Evolution","Cenozoic Evolution"]},
{n:"Year 3 · Advanced Paleontology",m:["Vertebrate Paleontology","Invertebrate Paleontology","Paleobotany","Micropaleontology","Paleoclimatology","Mass Extinctions","Functional Morphology","Biomechanics","Paleoanthropology","Biogeography"]},
{n:"Year 4 · Research Training",m:["Advanced Phylogenetics","Quantitative Paleontology","Fossil Preparation","Geochemical Paleontology","Digital Paleontology","3D Morphometrics","Scientific Research Methodology","Scientific Paper Analysis","Research Project","Dissertation"]}];

const LESSONS={fossil1:{
title:"What is a fossil?",
obj:["Define a fossil and explain why the definition is a convention.","Distinguish body fossils from trace fossils.","Describe the main ways remains are preserved.","Explain why the fossil record is biased, and why that does not make it useless."],
sec:[
["Introduction",["Paleontology is the scientific study of life in the geological past. It joins two older sciences: geology, which reads the history of rocks, and biology, which studies living things. The word fossil comes from the Latin fossilis, meaning “dug up”.","A fossil is any preserved evidence of an organism that lived in the geological past. Many textbooks use an age of roughly 10,000 years as a rough guide, close to the start of the Holocene. This is a human convention, not a natural boundary: there is no single moment when a bone becomes a fossil."]],
["Body fossils and trace fossils",["Body fossils are parts of the organism itself: bones, teeth, shells, wood, leaves, pollen. Trace fossils (ichnofossils) record what an organism did, not what it was: footprints, trackways, burrows, bite marks, and coprolites (fossil dung). Coprolites count as traces because they record biological activity, even though they contain material that came from the organism.","Trace fossils are valuable because they show behaviour, such as walking speed or feeding, that a skeleton alone cannot show. One animal can leave many traces in its life and can also leave several body remains, such as shed teeth, so counts of traces and bodies cannot be compared simply. Chemical traces, such as molecular remains of lipids, are sometimes called chemical fossils."]],
["How remains are preserved",["Fossilization is rare. Rapid burial greatly improves the chances of preservation, although it is not required for every pathway. Protection from scavengers and decay, and slow chemical change during burial, also help. The study of everything that happens between death and discovery is called taphonomy.","Common modes of preservation: (1) unaltered hard parts, such as some young shells and tooth enamel; (2) permineralization, where minerals from groundwater fill the tiny spaces in bone or wood; (3) replacement, where original material is dissolved and replaced by another mineral; (4) molds and casts, which are impressions and their fillings; (5) carbonization, a thin film of carbon left on leaves or soft-bodied animals; (6) entombment in amber (fossilized plant resin); (7) freezing or drying, which is rare and mostly geologically young."]],
["Why the fossil record is biased",["Organisms with hard parts fossilize far more easily than soft-bodied ones. Animals living where sediment is building up, such as shallow seas, lakes, and river floodplains, are over-represented. Animals living on eroding highlands are under-represented.","A few sites preserve soft tissues and fine detail. These are called Lagerstätten. Two well-known examples are the Cambrian Burgess Shale of British Columbia, Canada, and the Late Jurassic Solnhofen Limestone of Bavaria, Germany, famous for Archaeopteryx."]],
["Scientific reasoning",["Good paleontology separates observation from inference. The shape of a tooth is an observation. A claim about diet is an inference that needs support, such as wear patterns or comparison with living animals.","Gaps in the record are real, but their causes are understood and can be modelled. Scientists therefore state conclusions together with their uncertainty, instead of rejecting the record or treating it as complete."]]],
terms:[["Taphonomy","The study of processes affecting an organism after death, until it is found as a fossil."],["Diagenesis","Physical and chemical changes in sediment and buried remains after burial."],["Body fossil","Preserved part of the organism itself."],["Trace fossil (ichnofossil)","Preserved evidence of behaviour, such as a footprint or burrow."],["Coprolite","Fossilized dung."],["Permineralization","Mineral deposition in the pores of buried tissue."],["Lagerstätte","A site with exceptional fossil preservation."]],
mis:["“Fossils are always turned completely to stone.” Many fossil bones keep part of their original material, together with added minerals.","“Fossil means dinosaur.” Most fossils are of invertebrates, plants, and microbes.","“Most fossils are dated by radiocarbon.” Radiocarbon dating works only to roughly 50,000 years, and the practical limit depends on contamination and method. Older fossils are usually dated by measuring the rock layers around them, often volcanic layers, and by their position in the sequence.","“The fossil record is complete” and “the fossil record is useless” are both wrong. It is incomplete, with known biases."],
sum:["A fossil is preserved evidence of ancient life; the age cut-off is a convention.","Body fossils show anatomy; trace fossils show behaviour.","Preservation needs rapid burial and favourable chemistry, so it is rare and biased.","Scientists handle gaps by modelling the biases and reporting uncertainty."],
q:[
["Which of these is a trace fossil?",["A petrified tree trunk","A set of footprints preserved in mudstone","A shell replaced by calcite","An insect trapped in amber"],1,"Footprints record behaviour, not the body. The other three are parts of the organism itself, so they are body fossils."],
["Why are shelled marine animals so common in the fossil record?",["Soft-bodied animals did not exist before the Cambrian","Hard parts resist decay, and shallow seas bury remains quickly","Fossils can only form in water","Marine animals were always more numerous than land animals"],1,"Hard parts survive decay and shallow seas accumulate sediment. The other options are false or unsupported: soft-bodied life is known from older rocks, and land fossils do form."],
["Minerals from groundwater fill the pores of a buried bone. What is this process called?",["Carbonization","Permineralization","Freezing","Mold formation"],1,"Permineralization is the filling of pore spaces by minerals. Carbonization leaves a thin carbon film; a mold is an impression."],
["A student says: “The record is incomplete, so we can conclude nothing about the past.” Best evaluation?",["Correct, incomplete data is worthless","Incorrect, because the record is complete for marine life","Weak reasoning: biases are understood and conclusions are drawn with stated uncertainty","Correct, because fossils are unreliable"],2,"Every science works with incomplete data. The skill is to estimate how the gaps arose and how much they matter."]],
refs:[["OpenStax, Biology 2e (free university textbook)","https://openstax.org/details/books/biology-2e"],["Paleobiology Database (fossil occurrence data)","https://paleobiodb.org"],["International Commission on Stratigraphy (geological time scale)","https://stratigraphy.org"]]}};

D.done=D.done||{};D.ans=D.ans||{};D.notes=D.notes||[];

const total=()=>Object.keys(LESSONS).length;

/* Ages in millions of years (Ma). Approximate; check stratigraphy.org for revisions. */
const EARTH=4540;
const EONS=[[4540,4000,"#6b4a3a"],[4000,2500,"#8a6d4b"],[2500,538.8,"#a38f66"],[538.8,0,"#c9b38a"]];
const EVENTS=[
["Formation of Earth",4540,"Earth formed about 4,540 million years ago."],
["Oldest widely accepted evidence of life",3500,"Microbial structures and chemical traces from around 3,500 Ma. Older claims exist and are debated."],
["Great Oxidation Event",2400,"Free oxygen began to build up in the atmosphere, around 2,400 Ma."],
["Start of the Cambrian",538.8,"The Phanerozoic Eon begins. Boundary age follows the ICS chart and may be revised."],
["First land plants (approx.)",470,"Earliest evidence of land plants dates to the Ordovician, around 470 Ma."],
["First dinosaurs (approx.)",230,"The earliest dinosaurs appear in the Late Triassic, roughly 230 Ma."],
["Non-avian dinosaur extinction",66,"The end-Cretaceous mass extinction, about 66 Ma. Birds, which are living dinosaurs, survived."],
["Origin of Homo sapiens (approx.)",0.3,"The oldest fossils assigned to our species are about 300,000 years old."],
["Start of the Holocene",0.0117,"About 11,700 years ago. All written history sits inside this sliver."]];
let CK=6;
function clk(a){const s=(EARTH-a)/EARTH*86400,b=86400-s,p=n=>String(n).padStart(2,"0"),h=Math.floor(s/3600),m=Math.floor(s%3600/60),c=Math.floor(s%60);
return b<120?{t:p(h)+":"+p(m)+":"+p(c),n:b<1?"less than 1 second before midnight":b.toFixed(1)+" seconds before midnight"}:{t:p(h)+":"+p(m),n:""}}
function pt(f,r){const a=2*Math.PI*f;return[150+r*Math.sin(a),150-r*Math.cos(a)]}
function arc(f0,f1,col){const p=pt(f0,104),q=pt(f1,104);return `<path d="M${p[0].toFixed(1)} ${p[1].toFixed(1)} A104 104 0 ${f1-f0>.5?1:0} 1 ${q[0].toFixed(1)} ${q[1].toFixed(1)}" fill="none" stroke="${col}" stroke-width="14"/>`}
function selClock(i){CK=i;render()}
function clockHTML(){const f=a=>(EARTH-a)/EARTH,e=EVENTS[CK],c=clk(e[1]);
const lab=[[150,24,"00:00"],[262,154,"06:00"],[150,284,"12:00"],[38,154,"18:00"]].map(l=>`<text x="${l[0]}" y="${l[1]}" fill="#a39a88" font-size="11" text-anchor="middle" font-family="system-ui">${l[2]}</text>`).join("");
const dots=EVENTS.map((x,i)=>{const p=pt(f(x[1]),104);return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===CK?7:4.5}" fill="${i===CK?"#ffffff":"#1c1b1a"}" stroke="#e8dfcc" stroke-width="2" onclick="selClock(${i})"/>`}).join("");
return `<div class="card"><h3>The Deep Time Clock</h3><p class="sub">Earth’s 4.54 billion years squeezed into one day. Midnight is the birth of Earth; the next midnight is today.</p>
<svg class="ck" viewBox="0 0 300 300">${EONS.map(x=>arc(f(x[0]),f(x[1]),x[2])).join("")}${lab}${dots}<text x="150" y="152" fill="#e8dfcc" font-size="${c.t.length>5?24:30}" text-anchor="middle" font-family="Georgia,serif">${c.t}</text><text x="150" y="172" fill="#a39a88" font-size="10" text-anchor="middle" font-family="system-ui">on the 24-hour clock</text></svg>
<h3>${e[0]}</h3><div class="tag">${e[1]} Ma · ${c.t}${c.n?" ("+c.n+")":""}</div><p class="sub">${e[2]}</p>
${EVENTS.map((x,i)=>`<div class="ev tap ${i===CK?"on":""}" onclick="selClock(${i})"><b>${clk(x[1]).t}</b><span>${x[0]}</span></div>`).join("")}
<div class="tag" style="margin-top:8px">Ring colours: Hadean, Archean, Proterozoic, Phanerozoic. Tap a dot or a row.</div></div>`}
const PLAN={fossil2:"History and development of paleontology",fossil3:"Body fossils and trace fossils",fossil6:"Exceptional fossil preservation and Lagerstätten",fossil7:"Fossil record completeness and preservation biases",fossil8:"Scientific interpretation of fossil evidence",fossil9:"Major historical discoveries in paleontology",fossil10:"Introduction to paleontological research methods"};
Object.assign(LESSONS,{
fossil4:{title:"Fossilization processes and preservation mechanisms",
obj:["Describe how burial and diagenesis change a dead organism’s tissues.","Explain permineralization, replacement, recrystallization, molds and casts, and carbonization in chemical terms.","Explain why bone, shell, wood and soft tissue preserve differently.","Judge what each preservation mode can and cannot tell us."],
sec:[
["Starting materials",["The raw material matters. Bone is mainly bioapatite, a calcium phosphate mineral, together with collagen protein. Many shells are calcium carbonate (CaCO3) as calcite or aragonite. Arthropod cuticle contains chitin; wood contains cellulose and lignin. Organic molecules such as collagen break down far faster than minerals, so most fossils are mineral records rather than preserved tissue.","Calcite and aragonite share the formula CaCO3 but have different crystal structures. Aragonite is less stable and often dissolves or converts to calcite during burial. This is one reason that some fossil shells survive only as molds, and others as calcite copies."]],
["Burial and diagenesis",["Diagenesis is the set of physical and chemical changes in sediment and buried remains after burial, short of metamorphism. As sediment piles up, pressure and temperature rise and pore waters change chemistry.","Key ideas. Porosity is the fraction of a rock or bone that is empty space. Groundwater is water filling pores below the water table. Dissolution is a mineral dissolving into water. Precipitation is a dissolved substance leaving solution as a solid, which happens when the water becomes supersaturated. Cementation is precipitation that binds sediment grains into rock."]],
["Mechanisms of preservation",["Permineralization: groundwater carries dissolved minerals, such as silica or calcite, into pores. Minerals precipitate inside the pores. The original tissue structure often remains, so thin sections of bone or wood can show cells and growth rings. Petrified wood is usually permineralization, often with some replacement.","Replacement: original material dissolves while another mineral precipitates in its place, sometimes at the scale of single cells. Examples are silicification of shells and pyritization, where iron sulfide replaces tissue.","Recrystallization: the same mineral re-forms into different crystals. Fine detail can be lost even though the mineral is unchanged.","Molds and casts: if a shell dissolves it leaves a mold, an impression of its shape. Sediment or minerals filling the mold form a cast. An internal mold records the inside of the shell.","Carbonization (compression): heat and pressure drive off volatile elements and leave a thin carbon film. This is common in fossil leaves and in some soft-bodied animals.","Other pathways: amber is fossilized plant resin that can entomb small organisms in fine detail. Freezing preserves carcasses in permafrost, but only in geologically young cases such as Pleistocene mammoths."]],
["Controls on preservation",["Preservation depends on tissue composition, burial speed, oxygen level, acidity (pH), microbial activity, pore-water chemistry, temperature and time. Rapid burial greatly improves the odds, but it is not required for every pathway.","Reports of original proteins or soft-tissue structures in some dinosaur bones are an active scientific debate. Interpretations include original biomolecules, microbial biofilm, and contamination. No such claim should be treated as settled from a single paper."]],
["What each mode tells us",["Permineralized bone can reveal internal structure and growth. Carbon films can reveal outline and soft-part shape but little internal anatomy. Molds reveal surface detail but not original composition. Always ask which kinds of information the preservation mode has erased."]]],
terms:[["Bioapatite","The calcium phosphate mineral that makes up bone and teeth."],["Porosity","Fraction of a material that is empty space."],["Precipitation","A dissolved substance forming a solid from solution."],["Recrystallization","Same mineral, new crystal structure."],["Internal mold","Impression of the inside of a shell, often filled with sediment."],["Carbonization","Preservation as a thin carbon film."]],
mis:["“Petrified wood is wood turned into stone atom by atom.” Often minerals fill the pores first, with some replacement later.","“Fossilization needs millions of years.” The mineral changes can begin soon after burial; age is a separate matter.","“All fossils are replaced by minerals.” Some retain original mineral material, and a few are frozen or in amber."],
sum:["Diagenesis changes remains after burial through dissolution, precipitation and recrystallization.","Permineralization fills pores; replacement swaps minerals; recrystallization changes crystals.","Carbon films, molds, amber and freezing preserve different information.","Each preservation mode limits what we can conclude."],
q:[
["Groundwater deposits silica inside the pores of buried wood, keeping cell structure visible. Which process is this?",["Replacement only","Permineralization","Carbonization","Recrystallization"],1,"Minerals precipitated into open pores. Replacement would dissolve the original material while swapping in a new mineral."],
["Why can an aragonite shell be missing from a rock that still holds its mold?",["Aragonite is more stable than calcite","Aragonite can dissolve or convert to calcite during burial","Molds only form in amber","Shells never dissolve"],1,"Aragonite is less stable, so pore waters can dissolve it, leaving an impression in the rock."],
["Which preservation mode best records the outline of a thin fern frond?",["Carbonization","Permineralization of bone","Freezing","Amber"],0,"Carbonization leaves a thin carbon film that records outline. The others suit different materials."],
["A paper reports possible dinosaur proteins. What is the best response?",["Accept it as settled","Reject it because DNA decays","Treat it as an active debate and check whether contamination and microbes were excluded","Ignore all soft-tissue studies"],2,"Extraordinary claims need independent confirmation, and alternative explanations must be tested."]],
refs:[["Briggs, D.E.G. (2003). The role of decay and mineralization in the preservation of soft-bodied fossils. Annual Review of Earth and Planetary Sciences 31: 275–301. (check details)","https://scholar.google.com/scholar?q=Briggs+2003+role+of+decay+and+mineralization+in+the+preservation+of+soft-bodied+fossils"],["OpenStax, Biology 2e","https://openstax.org/details/books/biology-2e"]]},
fossil5:{title:"Taphonomy: from death to discovery",
obj:["Describe the stages between death and discovery.","Explain how decay, scavenging, transport and weathering change the evidence.","Separate observations from taphonomic inferences on a specimen.","Explain why fossil abundance in a region is not simple past abundance."],
sec:[
["The taphonomic pathway",["Taphonomy was named by the Russian paleontologist Ivan Efremov in 1940. It studies everything that happens to remains between death and discovery. The usual sequence is: death, decay, scavenging, disarticulation, transport, burial, diagenesis, exposure, discovery.","Biostratinomy covers the events from death up to final burial. Fossildiagenesis covers changes after burial. Each stage filters the evidence, so the fossil assemblage is a biased sample of the living community."]],
["Decay, scavenging and disarticulation",["Soft tissue decays at rates that depend on temperature, oxygen, body size and microbes. As ligaments and muscle decay, a skeleton falls apart: this is disarticulation. Scavengers may remove, break and scatter bones, leaving tooth marks that can be compared with the bite of living carnivores.","A skeleton with bones still in anatomical contact is articulated. If bones from one individual lie close together but out of position, they are associated. Isolated bones tell the least about the death event."]],
["Transport and sorting",["In flowing water, different bones move differently. Experiments with small mammal carcasses by J.R. Voorhies grouped bones by how easily water moves them: ribs and vertebrae move first, limb bones more gradually, and skulls and jaws tend to stay behind as lag deposits. The idea is a useful guide, not a rule, because bone shape, density and flow conditions vary.","Sorting can create assemblages that never existed in life. A deposit rich in small, light bones may reflect water currents, not the original community."]],
["Weathering, burial and exposure",["Bones exposed on a land surface crack and flake. Behrensmeyer’s weathering stages, developed from bones in Amboseli, Kenya, grade this from stage 0 (fresh) to stage 5 (falling apart). Heavily weathered bone suggests long surface exposure before burial.","After burial, diagenesis acts. Erosion later exposes the fossil, and the exposed fossil begins to weather again. A paleontologist must recognize damage that happened before burial, after burial, and during recovery."]],
["Observation versus inference",["Observation: the bones lie in one layer, several are broken, and ribs are missing. Inference: perhaps flowing water removed the lighter elements, or scavengers broke them. To test these ideas, check the sediment for current structures, compare break patterns with scavenger damage, and map where each bone lies."]],
["The Sri Lankan context",["Around 90 percent of Sri Lanka’s bedrock is Precambrian crystalline rock, which does not hold fossils of this kind. Jurassic, Miocene and Quaternary sedimentary strata are mostly confined to a thin belt in the north and northwest (Edirisooriya et al., Geological Magazine).","One example is the small Tabbowa Basin in the Northwestern Province, where Jurassic plant fossils such as the fern Cladophlebis are preserved as impressions in mudstone. Plant macrofossil records in Sri Lanka are sparse, and a Permian Glossopteris flora has also been reported from a small exposure there.","This links to taphonomy. Few fossils from Sri Lanka compared with North America does not show fewer organisms lived here. Exposed sedimentary rock, collecting effort and research history all differ. This is a geological availability and sampling bias, covered more fully later."]]],

<h2>Learning objectives</h2><ul>${L.obj.map(o=>`<li>${o}</li>`).join("")}</ul>`+
L.sec.map(x=>`<h2>${x[0]}</h2>`+x[1].map(p=>`<p>${p}</p>`).join("")).join("")+
`<h2>Important terminology</h2><dl>${L.terms.map(t=>`<dt>${t[0]}</dt><dd>${t[1]}</dd>`).join("")}</dl>

`<div class="tag">Score: ${s.c} of ${s.t} (${s.n} answered)</div>
${L.ex?exHTML(V.id):""}<h2>References and further reading</h2><ul>${L.refs.map(r=>`<li><a href="${r[1]}" target="_blank" rel="noopener">${r[0]}</a></li>`).join("")}</ul>
<button class="btn" onclick="toggleDone('${V.id}')">${D.done[V.id]?"Mark as not complete":"Mark lesson complete"}</button><button class="btn g" onclick="go('notes')">Open notebook</button>`}

if(t==="prog"){const sc=Object.keys(LESSONS).map(i=>[i,score(i)]),weak=sc.filter(x=>x[1].n&&x[1].c/x[1].t<.75);return `<h1>Academic Progress</h1><p class="sub">Stored on this phone.</p>

<div class="card"><h3>Quiz scores</h3>${sc.map(x=>`<div>${LESSONS[x[0]].title} — ${x[1].c}/${x[1].t} (${x[1].n} answered)</div>`).join("")}</div>
<div class="card"><h3>Revision needed</h3><div>${weak.length?weak.map(x=>LESSONS[x[0]].title+" — below 75%, review the lesson.").join("<br>"):"Nothing flagged."}</div></div>
<div class="card"><h3>Curriculum</h3><div class="tag">4 years · 38 modules planned</div></div>`}

document.getElementById("nav").innerHTML=[["home","🏛️","Home"],["uni","🎓","University"],["notes","📓","Notebook"],["prog","📊","Progress"],["wp","🎨","Style"]].map(b=>`<button class="${m===b[0]?"on":""}" onclick="go('${b[0]}')"><span>${b[1]}</span>${b[2]}</button>`).join("")}
